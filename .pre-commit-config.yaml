repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^prisma/migrations/[^/]+/migration\.sql$
      - id: end-of-file-fixer
        exclude: ^prisma/migrations/[^/]+/migration\.sql$
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: prettier
        name: Prettier formatting
        entry: node node_modules/prettier/bin/prettier.cjs --write --ignore-unknown
        language: system
        files: \.(css|json|ya?ml|md|[cm]?[jt]sx?)$
      - id: eslint
        name: ESLint and safe formatting
        entry: node node_modules/eslint/bin/eslint.js . --fix --max-warnings=0
        language: system
        files: \.[cm]?[jt]sx?$
        pass_filenames: false
      - id: typecheck
        name: TypeScript type check
        entry: node node_modules/typescript/bin/tsc --noEmit
        language: system
        files: \.[cm]?[jt]sx?$
        pass_filenames: false
      - id: regression-tests
        name: Fast regression tests
        entry: node --import tsx --test tests/walkthrough-regressions.test.ts tests/chat-model-picker.test.ts tests/guardian-service.test.ts tests/ai-shield.test.ts tests/provider-recovery.test.ts tests/provider-errors.test.ts tests/gateway-content-block.integration.test.ts tests/story-studio.test.ts tests/settings-routes.test.ts tests/display-name.test.ts tests/response-token-limits.test.ts tests/app-appearance.test.ts tests/user-persona-editor.test.ts tests/user-persona-prompt.test.ts tests/chat-context-controls.test.ts tests/narrative-output-guard.test.ts tests/prologue-pov.test.ts tests/player-addressing.test.ts tests/response-prompt.test.ts tests/character-prompt-contract.test.ts tests/session-tools.test.ts tests/session-tool-routes.test.ts tests/integration-policy.test.ts tests/openrouter-provider.test.ts tests/provider-presets.test.ts tests/ai-gateway-providers.integration.test.ts
        language: system
        files: \.[cm]?[jt]sx?$
        pass_filenames: false
