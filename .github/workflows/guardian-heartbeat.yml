name: Guardian heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardian-heartbeat
  cancel-in-progress: true

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep Guardian awake
        env:
          GUARDIAN_URL: https://nythera-guardian.onrender.com
        run: |
          curl --fail --silent --show-error --max-time 45 \
            --retry 2 --retry-delay 5 "$GUARDIAN_URL/health" >/dev/null
