<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B12" />
    <title>Nythera Offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0b0b12;
        color: #f4f1ff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 122, 24, 0.18), transparent 38%),
          linear-gradient(180deg, #0b0b12 0%, #11101a 100%);
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 32px;
        background: rgba(20, 17, 31, 0.82);
        padding: 28px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      img {
        width: 56px;
        height: 56px;
        border-radius: 18px;
      }

      h1 {
        margin: 24px 0 8px;
        font-size: 26px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: rgba(244, 241, 255, 0.7);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Nythera is offline</h1>
      <p>Reconnect to continue chats, load characters, and stream model responses.</p>
    </main>
  </body>
</html>
