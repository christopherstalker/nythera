<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080907" />
    <title>Nythera Offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #080907;
        color: #c9c2b8;
        font-family: Georgia, "Times New Roman", serif;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #080907;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgba(201, 194, 184, 0.22);
        background: #0d0e0c;
        padding: 28px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      img {
        width: 56px;
        height: 56px;
      }

      h1 {
        margin: 24px 0 8px;
        font-size: 26px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: rgba(201, 194, 184, 0.68);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/nythera-codex-v1-192.png" alt="" />
      <h1>Nythera is offline</h1>
      <p>Reconnect to continue chats, load characters, and stream model responses.</p>
    </main>
  </body>
</html>
